<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>my index page</title>
<link rel="shortcut icon" href="favicon.ico" />
<style>

    div {
        width: 200px;
        height: 200px;
        background: black;
        margin: 50px;
    }

    #static {
        background: orange;
        position: static;
    }
    #sticky {
        background: teal;
        position: sticky;
    }
    #relative {
        background: brown;
        position: relative;
        left: 100px;
        top: -100px;
    }
    #fixed {
        background: forestgreen;
        position: fixed;
        left: 200px;
    }
    #absolute {
        background: gainsboro;
        position: absolute;
        left: 300px;
        bottom: -500px;
    }

</style>
</head>
            
<body>
        
        <div id="static"> </div>
        <div id="sticky"> </div>
        <div id="relative"> </div>
        <div id="fixed"> </div>
        <div id="absolute"> </div>

</body>

</html>
